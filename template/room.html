{% extends "layout.html" %}

{% block title %}
    Room
{% endblock %}

{% block body %}

    <div class="top-info">
        <span><b>Active Room: {{room}}</b> ({{song_count}} tracks)</span>
        <span id="count" style="margin-left: 30px;">Waiting for round...</span>
    </div>

    <div class="gameplay">
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 50px; margin-bottom: 15px;">
            <div id="timer-bar-container">
                <div id="timer-bar"></div>
            </div>
            <span id="timer" style="font-size: 18px; font-weight: bold; color: #58c777; min-width: 30px;">{{song_duration}}</span>
        </div>

        <audio id="audio-player" controls autoplay>
            <source src="" id="audio-source">
        </audio>

        <br>
        <input id="guessbox" type="text" autofocus class="inputBox" placeholder="Type here your guess..." autocomplete="off" tabindex="1" onpaste="return false;">
        <button id="submitter" class="submitBtn" onClick="submitGuess()"><b>Submit</b></button>
            
        <div id="leaderboard-container">
            <h3 class="leaderboard-header">Leaderboard</h3>
            <ul id="leaderboard-list"></ul>
        </div>
    </div>

    <div class="scroll">
        <div id="played-songs-list">
            <!-- Recently played songs will be added here -->
        </div>
    </div>

    <div class="chat-container">
        <div id="Chat" class="Chat">
            <div id="messages"></div>
            <br>
            <textarea id="message-input" placeholder="chat here..." tabindex="3"></textarea>
        </div>
        <div id="answer"></div>
    </div>

    <!-- Chat functionality (keep existing) -->
    <script>
        const socket = io();

        // Preloaded messages from Flask
        const messages = {{ messages | tojson }};

        // Function to render messages
        function renderMessages() {
            const messagesDiv = document.getElementById('messages');
            messages.forEach(msg => {
                const messageElem = document.createElement('p');
                if (msg.username === 'System') {
                    messageElem.innerHTML = `<strong style="color: #4CAF50;">${msg.username}:</strong> <span style="color: #4CAF50;">${msg.message}</span>`;
                } else {
                    messageElem.innerHTML = `<strong>${msg.username}:</strong> ${msg.message}`;
                }
                messagesDiv.appendChild(messageElem);
            });
            scrollToBottom();
        }

        // Function to scroll to the bottom of the messages container
        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Call function to render messages on page load
        renderMessages();

        // Listen for incoming messages
        socket.on('message', function(msg) {
            const messagesDiv = document.getElementById('messages');
            const messageElem = document.createElement('p');
            const parts = msg.split(': ');
            if (parts.length === 2) {
                const username = parts[0];
                const message = parts[1];
                if (username === 'System') {
                    messageElem.innerHTML = `<strong style="color: #4CAF50;">${username}:</strong> <span style="color: #4CAF50;">${message}</span>`;
                } else {
                    messageElem.innerHTML = `<strong>${username}:</strong> ${message}`;
                }
            } else {
                messageElem.textContent = msg;
            }
            messagesDiv.appendChild(messageElem);
            scrollToBottom();
        });

        // Send message when 'Enter' key is pressed
        document.getElementById('message-input').addEventListener('keydown', function(event) {
            const username = "{{username}}";
            const message = document.getElementById('message-input').value.trim();
            const room = "{{room}}";

            if (event.key === 'Enter' && message) {
                event.preventDefault();
                const formattedMessage = `${username}: ${message}_${room}`;
                socket.send(formattedMessage);
                document.getElementById('message-input').value = '';
                scrollToBottom();
            }
        });
    </script>

    <!-- Multiplayer Game Logic -->
    <script>
        const room = "{{room}}";
        const username = "{{username}}";
        let currentRound = 0;
        let myScore = 0;
        let roundActive = false;
        let timerInterval = null;
        let roundPoints = 0; // Track cumulative points for current round
        let playerStates = {}; // Track each player's current state in the round

        // Join game on page load
        socket.on('connect', () => {
            console.log('Connected to server');
            // Join the game room (handles both game and chat)
            socket.emit('join_game', {room_name: room});
        });

        // Game configuration (from server)
        const ROUNDS_PER_GAME = {{rounds_per_game}};
        const SONG_DURATION = {{song_duration}};

        // Initial game state
        socket.on('game_state', (data) => {
            console.log('Received game state:', data);
            currentRound = data.round;
            updateLeaderboard(data.leaderboard);
            document.getElementById('count').textContent = `Round: ${data.round}/${ROUNDS_PER_GAME}`;
            if (data.played_songs) {
                updatePlayedSongs(data.played_songs);
            }
        });

        // Round start
        socket.on('round_start', (data) => {
            console.log('Round starting:', data);
            currentRound = data.round;
            roundActive = true;

            // Close any existing cycle complete popup
            const existingPopup = document.querySelector('.cycle-popup-overlay');
            if (existingPopup) {
                existingPopup.remove();
            }

            // Update UI
            document.getElementById('count').textContent = `Round: ${data.round}/${ROUNDS_PER_GAME}`;

            // Reset round points and player states for new round
            roundPoints = 0;
            playerStates = {};

            // Update audio
            const audio = document.getElementById('audio-player');
            const source = document.getElementById('audio-source');
            source.src = data.preview_url;
            audio.load();
            audio.play().catch(e => console.log('Audio play failed:', e));

            // Hide answer from previous round
            document.getElementById('answer').style.display = 'none';

            // Enable input
            const guessbox = document.getElementById('guessbox');
            guessbox.disabled = false;
            guessbox.value = '';
            guessbox.focus();

            // Update leaderboard
            updateLeaderboard(data.leaderboard);

            // Update played songs (will be empty on round 1)
            if (data.played_songs !== undefined) {
                updatePlayedSongs(data.played_songs);
            }

            // Start timer
            startTimer(SONG_DURATION);
        });

        // Player scored
        socket.on('player_scored', (data) => {
            console.log('Player scored:', data);

            // Track player state
            if (!playerStates[data.username]) {
                playerStates[data.username] = {
                    roundPoints: 0
                };
            }

            // Add points to player's round total
            playerStates[data.username].roundPoints = (playerStates[data.username].roundPoints || 0) + data.score;

            if (data.partial) {
                // Store partial guess info
                if (data.guessed_artist) {
                    playerStates[data.username].guessed_artist = true;
                }
                if (data.guessed_title) {
                    playerStates[data.username].guessed_title = true;
                }
            } else {
                // Complete guess
                playerStates[data.username].guessed_artist = true;
                playerStates[data.username].guessed_title = true;
                playerStates[data.username].time = data.time;
                playerStates[data.username].is_new_record = data.new_record;

                // Show NEW RECORD popup to all users
                if (data.new_record) {
                    const message = data.username === username
                        ? 'NEW RECORD!'
                        : `${data.username} got a NEW RECORD!`;
                    showNotification(message, 'success', 5000);
                }
            }

            // Update cumulative points for current user
            if (data.username === username) {
                myScore = data.total;
                roundPoints += data.score;
            }

            // Update leaderboard
            if (data.leaderboard) {
                updateLeaderboard(data.leaderboard);
            }
        });

        // Leaderboard update (when someone joins/leaves)
        socket.on('leaderboard_update', (data) => {
            updateLeaderboard(data.leaderboard);
        });

        // Round end
        socket.on('round_end', (data) => {
            console.log('Round ended:', data);
            roundActive = false;
            stopTimer();

            // Show answer
            const answerEl = document.getElementById('answer');
            answerEl.innerHTML = `<b>${data.artist}</b> - ${data.title}`;
            answerEl.style.display = 'block';

            // Update leaderboard
            updateLeaderboard(data.leaderboard);

            // Update played songs list
            if (data.played_songs) {
                updatePlayedSongs(data.played_songs);
            }

            // Show cycle complete popup if this was round 10
            if (data.cycle_complete && data.top_3) {
                showCycleCompletePopup(data.top_3);
            }

            // Next round starts automatically from server after 5s
        });

        // Submit guess
        function submitGuess() {
            const guess = document.getElementById('guessbox').value.trim().toLowerCase();

            // Clear input for next guess (always clear, even after timer expires)
            document.getElementById('guessbox').value = '';

            // Only submit if round is active and guess is not empty
            if (!roundActive || !guess) return;

            socket.emit('submit_guess', {
                room_name: room,
                guess: guess
            });
        }

        // Timer functions
        function startTimer(seconds) {
            let remaining = seconds;
            const timerEl = document.getElementById('timer');
            const timerBar = document.getElementById('timer-bar');

            timerEl.textContent = remaining;
            timerBar.style.width = '100%';
            timerBar.className = '';

            timerInterval = setInterval(() => {
                remaining -= 0.1;

                if (remaining <= 0) {
                    stopTimer();
                    timerEl.textContent = '0';
                    timerBar.style.width = '0%';
                    return;
                }

                timerEl.textContent = Math.ceil(remaining);
                timerBar.style.width = `${(remaining / seconds) * 100}%`;

                // Change color in last 3 seconds
                if (remaining < 3) {
                    timerBar.classList.add('warning');
                } else {
                    timerBar.classList.remove('warning');
                }
            }, 100);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Leaderboard
        function updateLeaderboard(players) {
            if (!players) return;

            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';

            players.forEach((player, index) => {
                const li = document.createElement('li');
                li.className = 'leaderboard-entry';

                // Add medal class for top 3
                if (index === 0) {
                    li.classList.add('first-place');
                } else if (index === 1) {
                    li.classList.add('second-place');
                } else if (index === 2) {
                    li.classList.add('third-place');
                }

                const playerName = player.username;
                const state = playerStates[playerName] || {};

                // Determine name color based on guess state
                let nameColor = '';
                if (state.guessed_artist && state.guessed_title) {
                    nameColor = '#2E7D32'; // Darker green for both
                } else if (state.guessed_artist || state.guessed_title) {
                    nameColor = '#4169E1'; // Blue for either artist or title
                }

                const nameStyle = nameColor ? `style="color: ${nameColor};"` : '';

                // Add guess time if available
                const timeDisplay = player.guess_time !== null ? ` (${player.guess_time}s)` : '';

                // Add round points indicator if any
                let pointsDisplay = '';
                if (state.roundPoints && state.roundPoints > 0) {
                    pointsDisplay = ` <span style="color: #2E7D32; font-weight: bold;">(+${state.roundPoints})</span>`;
                }

                li.innerHTML = `
                    <span class="rank">#${index + 1}</span>
                    <span class="username" ${nameStyle}>${player.username}${pointsDisplay}${timeDisplay}</span>
                    <span class="score">${player.score}</span>
                `;
                list.appendChild(li);
            });
        }

        // Update played songs list
        function updatePlayedSongs(songs) {
            if (!songs) return;

            const list = document.getElementById('played-songs-list');
            list.innerHTML = '';

            songs.forEach((song) => {
                const div = document.createElement('div');
                div.className = 'song_container';

                let recordText = '';
                if (song.record && song.record !== 0) {
                    recordText = `<p><b>Recordholder: </b>${song.player} (${song.record})</p>`;
                } else {
                    recordText = '<p><b>Recordholder: </b></p>';
                }

                div.innerHTML = `
                    <img src="${song.artwork}" class="imageurl">
                    <div class="title_artist">
                        <p><b>${song.artist}</b> - ${song.title}</p>
                        ${recordText}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // Notifications
        function showNotification(message, type = 'info', duration = 3000) {
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.classList.add('show');
            }, 10);

            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, duration);
        }

        // Cycle complete popup
        function showCycleCompletePopup(top3) {
            // Create overlay
            const overlay = document.createElement('div');
            overlay.className = 'cycle-popup-overlay';

            // Create popup
            const popup = document.createElement('div');
            popup.className = 'cycle-popup';

            let popupHTML = '<h2>Cycle Complete!</h2><h3>Top 3 Players</h3><div class="top3-list">';

            top3.forEach((player, index) => {
                const medal = ['🥇', '🥈', '🥉'][index];
                popupHTML += `
                    <div class="top3-entry">
                        <span class="medal">${medal}</span>
                        <span class="player-name">${player.username}</span>
                        <span class="player-stats">
                            Score: ${player.total_score} | Avg Time: ${player.average_time}s
                        </span>
                    </div>
                `;
            });

            popupHTML += '</div><button class="close-popup" onclick="this.parentElement.parentElement.remove()">Close</button>';
            popup.innerHTML = popupHTML;

            overlay.appendChild(popup);
            document.body.appendChild(overlay);

            // Auto-close after 10 seconds
            setTimeout(() => {
                if (overlay.parentElement) {
                    overlay.remove();
                }
            }, 10000);
        }

        // Enter key to submit
        document.getElementById('guessbox').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                e.preventDefault();
                submitGuess();
            }
        });

        // Leave game on page unload
        window.addEventListener('beforeunload', () => {
            socket.emit('leave_game', {room_name: room});
        });
    </script>

{% endblock %}
