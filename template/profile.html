{% extends "layout.html" %}

{% block title %}
    Profile
{% endblock %}

{% block body %}


<div class = 'temp'>
    <h1>Profile of {{Database.username}}</h1>

    <p>Score: <b>{{Database.Score}}</b></p>
    <p>Total_Guesses: <b>{{Database.Guess_Count}}</b></p>
    <p>Mean Guess Time: <b>{{Database.MGT}}</b></p>

    <a href="/records/{{Database.username}}/Billion" class="button-link">
        <button type="button">See this player's personal records</button>
    </a>
</div>


{% endblock %}
